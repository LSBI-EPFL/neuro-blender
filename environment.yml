# Conda environment for Neuro Blender.
# Make it once:     cd <path of the neuro-blender folder>
#                   conda env create -f environment.yml
# Then each time:   cd <path of the neuro-blender folder>
#                   conda activate neuro-blender
#                   python main.py               (the window)
#                   python main.py --terminal    (the terminal)
name: neuro-blender
channels:
  - conda-forge
dependencies:
  - python=3.11
  - ezdxf>=1.4        # reads DXF files
  - gdstk>=0.9        # reads GDS files
  - shapely>=2.0      # geometry: which shapes are inside the device
  - matplotlib>=3.8   # the layer images
  - numpy>=1.26
  - pyyaml>=6.0       # reads and writes the answers file (stack.yaml)
  - rich>=13.0        # the terminal display: colours, panels, tables, progress bars
  - questionary>=2.0  # the questions: arrow-key menus, checkboxes, input checks
  - tk                # the window (GUI) and the pop-up windows (file and colour)
  - pillow>=10.0      # shows the images in the window
